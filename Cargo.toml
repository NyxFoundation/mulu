[workspace]
resolver = "2"
members = ["crates/mulu-model", "crates/mulu-solc", "crates/mulu-yul", "crates/mulu-abstraction", "crates/mulu-replay", "crates/mulu-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/NyxFoundation/mulu"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
ruint = { version = "1", default-features = false, features = ["alloc"] }
